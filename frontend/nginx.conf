server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El frontend y la API se sirven desde el MISMO origen. Es lo que evita
    # tener que abrir CORS: el navegador ve un solo dominio, y el modulo no
    # necesita `Flask-Cors` en produccion.
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una pregunta con un modelo local puede tardar. Con los 60s por
        # omision de nginx, la peticion muere con 504 aunque el backend siga
        # trabajando y acabe contestando bien.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Una aplicacion de una sola pagina: cualquier ruta desconocida devuelve
    # el index y deja que el enrutador del navegador decida.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
