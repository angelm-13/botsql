# Despliegue del modulo de BI: frontend + backend.
#
# La base de datos NO esta aqui a proposito: este modulo se conecta a la base
# que ya existe del proyecto anfitrion, no trae la suya. `BI_DATABASE_URL`
# apunta a donde viva -- otro contenedor, otro servidor, una replica de
# lectura.
#
#   docker compose up -d --build
#   -> frontend en http://localhost:8090  (la API va por el mismo origen)
#
# (8090 y no 8080: en mas de una maquina de prueba el 8080 ya estaba tomado
# por el nginx de OTRO proyecto -- confirmado en la practica. Si 8090
# tambien choca en la suya, cambie BI_PUERTO en su .env.)
#
# Ollama tampoco esta por omision: si ya corre en la maquina anfitriona, se
# consume con `host.docker.internal`. Para levantarlo aqui:
#
#   docker compose --profile con-modelo up -d

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Sin valor por omision real a proposito -- pero tampoco `:?` duro:
      # eso rompia `docker-compose.demo.yml` (ese override SI fija un valor
      # real, pero la sustitucion de este archivo se evalua antes del
      # merge, asi que un `:?` aqui truena aunque el override lo vaya a
      # reemplazar). La barrera de verdad vive en la aplicacion
      # (`app.py::crear_engine`), que se niega a arrancar sin esto -- con un
      # mensaje mas completo que el que podria dar aqui, con ejemplos por
      # motor.
      #
      # OBLIGATORIO en un despliegue real. Use un rol de SOLO LECTURA, no el
      # superusuario: es la unica barrera que no depende de que el
      # validador sea perfecto.
      BI_DATABASE_URL: ${BI_DATABASE_URL:-}

      BI_OLLAMA_URL: ${BI_OLLAMA_URL:-http://host.docker.internal:11434}
      # Tiene que ser el tag EXACTO ya descargado (`ollama list`): este y
      # "qwen2.5-coder:7b-instruct" son el mismo modelo en el registro, pero
      # Ollama los trata como pulls distintos.
      #
      # "3b" por omision: probado contra dos preguntas con JOIN reales,
      # ambas correctas al centavo y bastante mas rapido que "7b" -- que en
      # la misma maquina, con CPU compartida, dio timeout a los 270s (ver
      # .env.example para el detalle medido). Cambielo a "qwen2.5-coder:7b"
      # si sus preguntas son mas complejas que un JOIN de dos tablas.
      BI_MODEL: ${BI_MODEL:-qwen2.5-coder:3b}
      # Medido real: ~90-100s por pregunta en CPU pura, 166s dentro de
      # Docker con otros contenedores compitiendo por CPU. Con GPU baja a
      # segundos. Tiene que quedar por debajo del timeout de gunicorn
      # (backend/Dockerfile) y de nginx (frontend/nginx.conf), los dos en
      # 300s -- si no, el sintoma es un 504 vacio en vez de un error claro.
      BI_LLM_TIMEOUT: ${BI_LLM_TIMEOUT:-270}

      # Que ve el modelo. Vacio = todo lo que no caiga en la lista negra.
      BI_INCLUDE_TABLES: ${BI_INCLUDE_TABLES:-}
      BI_MAX_TABLES: ${BI_MAX_TABLES:-60}
      BI_ROW_LIMIT: ${BI_ROW_LIMIT:-1000}
      BI_SQL_TIMEOUT_MS: ${BI_SQL_TIMEOUT_MS:-15000}
      BI_SCHEMA_TTL: ${BI_SCHEMA_TTL:-300}
      # Reusa el JSON de una pregunta identica mientras el esquema no cambie
      # -- no cachea datos, el SQL se re-ejecuta fresco siempre. 0 lo apaga.
      BI_QUESTION_CACHE_TTL: ${BI_QUESTION_CACHE_TTL:-3600}
    extra_hosts:
      # Permite alcanzar un Ollama que corre en la maquina anfitriona. En
      # Linux no viene resuelto solo, a diferencia de Docker Desktop.
      - "host.docker.internal:host-gateway"
    # El puerto NO se publica: solo el frontend habla con el backend, por la
    # red interna. Publicarlo dejaria la API sin autenticacion expuesta.
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/api/v1/bi/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BI_PUERTO:-8090}:80"

  # Perfil opcional: el modelo dentro del mismo compose.
  ollama:
    image: ollama/ollama:latest
    profiles: ["con-modelo"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
