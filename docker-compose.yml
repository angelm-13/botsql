services:
  db:
    image: postgres:16-alpine
    container_name: db-with-bi
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${DB_PUBLIC_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./infra/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tyakxa_net]

  # Aplica database/migrations al arrancar, igual que el initContainer
  # `db-migrate` de k8s (ver k8s/base/backend.yaml): mismo psql, mismo orden
  # lexicografico -que es el cronologico, por el prefijo de fecha del nombre- y
  # el mismo ON_ERROR_STOP=1.
  #
  # Por que existe este servicio y no una linea en entrypoint.sh: el arranque
  # del backend dejo de aplicar migraciones a proposito (25f6563), porque
  # apply_migrations.py exige DATABASE_URL y en k8s no existe. La consecuencia
  # no buscada fue que el camino de docker-compose se quedo sin NINGUN
  # mecanismo: `init_db.py` crea las tablas desde los modelos, pero no aplica
  # ninguna de las migraciones, asi que una instalacion nueva levantaba con las
  # tablas vacias de permisos -la matriz de entity_permission llega por
  # migracion- y nadie veia nada.
  #
  # Se resuelve con el mecanismo que ya se eligio para k8s en vez de devolver la
  # linea al entrypoint: no toca el arranque del backend, no cambia nada en
  # produccion, y las 59 migraciones estan verificadas como reaplicables.
  db-migrate:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        # Se espera a Postgres aunque el compose ya lo diera por sano.
        #
        # En el primer arranque Postgres ejecuta sus scripts de init y se
        # reinicia, y entre una cosa y otra el healthcheck responde sano un
        # instante antes de que el servidor acepte conexiones. Sin esta espera,
        # una instalacion desde cero fallaba en la primera migracion con
        # "Connection refused" -medido borrando el volumen-.
        #
        # Es la misma espera que el initContainer de k8s, que la trae por el
        # mismo motivo; al copiar el bucle de psql se habia dejado fuera.
        i=0
        until pg_isready -q; do
          i=$$((i + 2))
          if [ "$$i" -ge 120 ]; then
            echo "db-migrate: Postgres no respondio en 120s, abortando"
            exit 1
          fi
          echo "db-migrate: esperando a Postgres..."
          sleep 2
        done
        for f in /migrations/*.sql; do
          echo "db-migrate: aplicando $$(basename "$$f")"
          psql -v ON_ERROR_STOP=1 -q -v licensed_modules="$${LICENSED_MODULES:-}" -f "$$f"
        done
        echo "db-migrate: esquema al dia"
    networks: [tyakxa_net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tyakxa_net]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-with-bi
    restart: unless-stopped
    env_file: [.env]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [tyakxa_net]

  backend:
    container_name: backend-with-bi
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      # Se espera a que las migraciones acaben, no solo a que la base responda:
      # arrancar contra un esquema a medias da errores que no parecen de
      # esquema -una columna que falta se ve como un fallo de la aplicacion-.
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-5001}:${BACKEND_PORT:-5001}"
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./documents-reports:/documents-reports
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${BACKEND_PORT:-5001}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tyakxa_net]

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./documents-reports:/documents-reports
      - ./database:/database:ro
    command: celery -A celery_worker.celery worker --loglevel=INFO
    networks: [tyakxa_net]

  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./documents-reports:/documents-reports
      - ./database:/database:ro
    command: celery -A celery_worker.celery beat --loglevel=INFO
    networks: [tyakxa_net]

  frontend:
    container_name: frontend-with-bi
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: dev
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [tyakxa_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/logs:/var/log/nginx
    networks: [tyakxa_net]

volumes:
  db_data:
  ollama_data:
networks:
  tyakxa_net:
    driver: bridge
