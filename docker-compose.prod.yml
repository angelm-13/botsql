services:
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: prod
    volumes: []
    ports: []
  backend:
    volumes:
      - ./uploads:/uploads
      - ./documents-reports:/documents-reports
      - ./database:/database:ro
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
