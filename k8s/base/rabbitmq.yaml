# Deployment simple (no StatefulSet): si el pod muere y reaparece con
# la cola vacía, Celery reintenta las tareas — RabbitMQ no es una
# fuente de verdad como Postgres, así que no necesita disco persistente
# ni identidad estable.
#
# Sin Ingress: el panel de administración (puerto 15672) no se expone
# públicamente por cliente — reduce superficie de ataque. Para revisar
# colas se usa `kubectl port-forward` puntual.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # Ver nota en backend.yaml: evita que Kubernetes inyecte variables
      # tipo <SERVICE>_PORT de otros Services del namespace.
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          # Sin envFrom a propósito: RabbitMQ solo necesita sus propias
          # RABBITMQ_DEFAULT_*. Inyectarle el resto de app-secrets (DB_
          # PASSWORD, JWT_SECRET, MFA_ENCRYPTION_KEY...) le daría acceso a
          # secretos que no usa y que no debería poder leer si este
          # contenedor (proceso de terceros) se ve comprometido.
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_DEFAULT_PASS } }
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 400m
              memory: 320Mi
          # Probes por puerto TCP (AMQP), no con rabbitmq-diagnostics. Medido el
          # 2026-11-02 en tyakxa-dev: cada `rabbitmq-diagnostics` arranca su propio nodo
          # Erlang y cuesta ~0.85 s de CPU; con readiness cada 15 s y liveness cada 20 s
          # son ~100m de CPU permanentes (de los 112m que gastaba el pod en reposo),
          # en cada ambiente. Un tcpSocket cuesta casi cero. Se pierde que el check valide
          # alarmas/plugins, pero el broker escucha en 5672 solo cuando ya arranco, y si
          # el proceso muere el puerto se cierra y el liveness lo reinicia.
          readinessProbe:
            tcpSocket:
              port: 5672
            timeoutSeconds: 5
            periodSeconds: 10
            initialDelaySeconds: 20
          livenessProbe:
            tcpSocket:
              port: 5672
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: mgmt
      port: 15672
