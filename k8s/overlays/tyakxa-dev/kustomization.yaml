# Overlay real del entorno interno de pruebas (no es cliente de verdad).
# Instanciado desde k8s/overlays/_template con el commit 533ebb0 (build
# verde en Actions: backend, worker, db-init y frontend-tyakxa-dev).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tyakxa-dev
resources:
  - ../../base
images:
  - name: DB_INIT_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-db-init
    newTag: "0a00c2f"
  - name: BACKEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-backend
    newTag: "0a00c2f"
  - name: WORKER_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-worker
    newTag: "0a00c2f"
  - name: FRONTEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-frontend
    newTag: "0a00c2f-tyakxa-dev"
# letsencrypt-staging a propósito: es la primera vez que se aplica este
# overlay, así que es probable que haya que reintentar (DNS, typos, etc.)
# antes de que quede bien. Cambiar a letsencrypt-prod solo cuando ya haya
# certificado válido emitido en staging y todo funcione.
patches:
  - target:
      kind: Ingress
      name: tyakxa-tny
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
      - op: replace
        path: /spec/tls/0/hosts/0
        value: tyakxa-dev.tyakxa.com.mx
      - op: replace
        path: /spec/tls/1/hosts/0
        value: api-tyakxa-dev.tyakxa.com.mx
      - op: replace
        path: /spec/rules/0/host
        value: tyakxa-dev.tyakxa.com.mx
      - op: replace
        path: /spec/rules/1/host
        value: api-tyakxa-dev.tyakxa.com.mx
