# Overlay real de producción para vidrioyaluminios (dominio
# vidrioyaluminios.torredigital.mx). Instanciado desde
# k8s/overlays/torredigital-prod (mismo patrón: un solo origen, front +
# API bajo /api, DNS ya confirmado con nslookup).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vidrioyaluminios-prod
images:
  - name: DB_INIT_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-db-init
    newTag: "2aaf212"
  - name: BACKEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-backend
    newTag: "2aaf212"
  - name: WORKER_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-worker
    newTag: "2aaf212"
  - name: FRONTEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-frontend
    newTag: 2aaf212-vidrioyaluminios-prod
resources:
  - ../../base
  - ingress-single-origin.yaml
patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: tyakxa-tny
      $patch: delete
