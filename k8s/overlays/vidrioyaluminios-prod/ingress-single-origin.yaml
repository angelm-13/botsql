# Cliente real (vidrioyaluminios) con UN SOLO dominio, mismo patrón que
# adser-prod y torredigital-prod (ver torredigital-prod para el porqué de
# los dos objetos Ingress: nginx.ingress.kubernetes.io/rewrite-target
# aplica a TODO el Ingress, así que /api necesita su propio objeto
# separado de /auth, /graphql y /).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vidrioyaluminios-prod-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["vidrioyaluminios.torredigital.mx"]
      secretName: vidrioyaluminios-torredigital-tls
  rules:
    - host: vidrioyaluminios.torredigital.mx
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 5001 } } }
          - path: /graphql
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 5001 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vidrioyaluminios-prod-api-prefix
  annotations:
    # Sin cert-manager.io/cluster-issuer aquí a propósito: el Ingress de
    # arriba ya pide el certificado para este dominio; pedirlo dos veces
    # duplicaría la solicitud a Let's Encrypt.
    # Subidas de documentos hasta 12 MB (default de nginx: 1 MB); la app limita a 10 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["vidrioyaluminios.torredigital.mx"]
      secretName: vidrioyaluminios-torredigital-tls # mismo Secret que ya gestiona el otro Ingress
  rules:
    - host: vidrioyaluminios.torredigital.mx
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: backend, port: { number: 5001 } } }
