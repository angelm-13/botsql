# Overlay real de producción para torredigital (primer cliente real del
# ERP). Instanciado desde k8s/overlays/_template.
#
# Dominio: sistema.torredigital.mx, un solo origen (front + API bajo
# /api) — mismo patrón que tyakxa-dev, ya validado ahí. Por eso el
# Ingress del base se elimina y se usa ingress-single-origin.yaml en su
# lugar (ver ese archivo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: torredigital-prod
images:
  - name: DB_INIT_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-db-init
    newTag: "4fb6691"
  - name: BACKEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-backend
    newTag: "4fb6691"
  - name: WORKER_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-worker
    newTag: "4fb6691"
  - name: FRONTEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-frontend
    newTag: 4fb6691-torredigital-prod
resources:
  - ../../base
  - ingress-single-origin.yaml
# Respaldo diario de Postgres (ensayado en tyakxa-dev). En produccion se aplica
# SOLO este componente, con `kubectl apply -k <overlay> -l
# app.kubernetes.io/component=respaldo-postgres`, para no arrastrar otros
# cambios pendientes del base.
components:
  - ../../components/respaldo-postgres
patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: tyakxa-tny
      $patch: delete
  # celery-beat sin nodeSelector cayo en k3s-worker1 (VPS temporal que se va a
  # retirar, 2026-10-29). No tiene volumen: moverlo es solo reprogramar el pod. tier=big
  # lo deja en master1/master4. Se aplico en vivo con `kubectl patch` (el resto del
  # overlay tiene cambios de base pendientes que un `apply -k` completo arrastraria).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: celery-beat
      spec:
        template:
          spec:
            nodeSelector:
              tier: big
  # PriorityClass del cliente ERP #1 (ver p1-torredigital-prod, aplicada al
  # clúster con kubectl apply -f priority-classes.yaml). target sin `name`
  # aplica a los 5 Deployments del base (backend, celery-worker, celery-beat,
  # frontend, rabbitmq) de un solo patch.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: p1-torredigital-prod
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: p1-torredigital-prod
  # Los dos patches de arriba no alcanzan a un CronJob: su pod vive en
  # jobTemplate.
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/priorityClassName
        value: p1-torredigital-prod
