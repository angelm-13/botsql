# Overlay real de producción para torredigital (primer cliente real del
# ERP). Instanciado desde k8s/overlays/_template.
#
# Dominio: sistema.torredigital.com.mx, un solo origen (front + API bajo
# /api) — mismo patrón que tyakxa-dev, ya validado ahí. Por eso el
# Ingress del base se elimina y se usa ingress-single-origin.yaml en su
# lugar (ver ese archivo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: torredigital-prod
images:
  - name: DB_INIT_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-db-init
    newTag: "8a2b2a3"
  - name: BACKEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-backend
    newTag: "8a2b2a3"
  - name: WORKER_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-worker
    newTag: "8a2b2a3"
  - name: FRONTEND_IMAGE_PLACEHOLDER
    newName: ghcr.io/tyakxa/tyakxa-tny-frontend
    # PENDIENTE: build-images.yml solo construye la imagen de frontend
    # para clientes listados en deploy/clients.yaml. Hasta que se agregue
    # "torredigital"/"prod" ahí y corra el pipeline, esta imagen no
    # existe en ghcr.io todavia — reemplazar REEMPLAZAR_SHA por el
    # sha_short real una vez que ese build termine en verde.
    newTag: REEMPLAZAR_SHA-torredigital-prod
resources:
  - ../../base
  - ingress-single-origin.yaml
patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: tyakxa-tny
      $patch: delete
