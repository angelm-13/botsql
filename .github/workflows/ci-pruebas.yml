# Pruebas del backend y migraciones en cada pull request hacia initAlan.
#
# Archivo APARTE de build-images.yml y de ci-seguridad.yml: no construye ni
# despliega nada, no usa secretos y solo pide permiso de lectura.
#
# Dos jobs:
#   - migraciones: init.sql + todas las migraciones sobre un Postgres LIMPIO, y
#     la pasada completa OTRA VEZ. El clúster las reaplica todas en cada arranque
#     del backend (initContainer db-migrate, sin tabla de control), así que una
#     migración que funciona la primera vez y truena la segunda tumba ambientes.
#     Es lo que más veces ha pasado.
#   - pytest: la suite del backend con TESTING=1 (SQLite en memoria, igual que
#     backend/run_tests.sh).
#
# LÍMITE conocido: las pruebas que solo corren en PostgreSQL (KPIs, concurrencia
# de inventario, documentos/laboratorio) se SALTAN aquí sin avisar, porque la suite
# usa SQLite. Se corren a mano con backend/ci/run_postgres_tests.sh.
#
# Convención heredada: cada `uses:` va fijado al SHA del commit.
name: ci-pruebas

on:
  pull_request:
    # `main` tambien: un PR de promocion (cambia el tag de un overlay) va hacia main y el
    # ruleset de esa rama exige estos checks; sin este trigger nunca correrian.
    branches: [initAlan, main]
  workflow_dispatch: {}

concurrency:
  group: ci-pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migraciones:
    name: Migraciones (base limpia, dos pasadas)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Misma versión que el clúster y el docker-compose (postgres:16-alpine).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_pg_2026
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci_pg_2026
      PGDATABASE: erp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, fijado 2026-08-17

      # Igual que el compose: Postgres corre database/init.sql al crear la base
      # (trae el bootstrap: user=1, proyect=1, status=1, customer_supplier=1).
      - name: init.sql
        run: psql -v ON_ERROR_STOP=1 -q -f database/init.sql

      # Mismo bucle que el servicio db-migrate: orden alfabético, ON_ERROR_STOP,
      # y licensed_modules vacío (todos los módulos). La segunda pasada es el replay.
      - name: Migraciones, pasada 1 (base limpia)
        run: |
          n=0
          for f in database/migrations/*.sql; do
            n=$((n+1))
            echo "aplicando $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -v licensed_modules="" -f "$f"
          done
          echo "### Migraciones, pasada 1: $n aplicadas" >> "$GITHUB_STEP_SUMMARY"

      - name: Migraciones, pasada 2 (replay)
        run: |
          n=0
          for f in database/migrations/*.sql; do
            n=$((n+1))
            echo "aplicando $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -v licensed_modules="" -f "$f"
          done
          echo "### Migraciones, pasada 2 (replay): $n aplicadas" >> "$GITHUB_STEP_SUMMARY"

  pytest:
    name: Pruebas del backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TESTING: '1'
      JWT_SECRET: test-secret
      JWT_SS: test-secret
      MFA_ISSUER: TYAKXA Test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, fijado 2026-08-17

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, fijado 2026-08-17
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      # Las mismas librerías de sistema que instala infra/docker/backend.Dockerfile.
      # WeasyPrint las necesita para generar PDF (recibos, vales).
      - name: Librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libcairo2 \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      # La app espera la carpeta en /documents-reports (así la monta el contenedor).
      - name: Enlazar documents-reports
        run: sudo ln -s "$GITHUB_WORKSPACE/documents-reports" /documents-reports

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt pytest

      - name: pytest
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider -W ignore::DeprecationWarning
