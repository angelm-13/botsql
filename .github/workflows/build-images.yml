# Construye lo que cambia con cada commit:
#
#   1. backend + worker + db-init  -> una sola vez, son iguales para
#      todos los clientes (la configuración por cliente entra en
#      runtime vía Secret de Kubernetes, no en la imagen).
#   2. frontend                     -> una vez POR CADA cliente activo
#      en deploy/clients.yaml, porque VITE_API_BASE_URL queda
#      horneado en el build de Vite y cada cliente tiene su propio
#      subdominio api-<cliente>-<env>.tyakxa.com.mx.
#
# Este workflow solo construye y publica imágenes en ghcr.io/tyakxa.
# No aplica nada al clúster: actualizar el tag en el overlay y correr
# `kubectl apply -k` se deja manual a propósito, para no perder el
# hábito de "cambiar la etiqueta en el manifiesto y commitear".
name: build-images

on:
  push:
    # Por ahora el despliegue se hace desde initAlan, no desde main
    # (todavía no hay PR) — se deja "main" en la lista para que el
    # día que se mergee, este mismo trigger siga funcionando sin
    # tocar nada. Quitar "initAlan" cuando esa rama deje de ser la
    # fuente de los despliegues.
    branches: [main, initAlan]
  # workflow_dispatch queda para cuando este archivo ya viva en main:
  # GitHub solo permite dispararlo a mano (CLI/API) desde OTRAS ramas
  # si el workflow ya existe en la rama default — hoy, con initAlan
  # como rama de trabajo, este trigger no es utilizable todavía. El
  # trigger de "push" de arriba es el que de verdad funciona mientras
  # tanto.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write # necesario para poder hacer push a ghcr.io

jobs:
  # Job auxiliar: lee deploy/clients.yaml y lo expone como JSON para
  # que el job de frontend lo use como matrix. Si clients.yaml está
  # vacío (clients: []), el matrix queda vacío y ese job simplemente
  # no corre para nadie — no falla.
  leer-clientes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          echo "matrix=$(yq -o=json '.clients' deploy/clients.yaml -I=0)" >> "$GITHUB_OUTPUT"

  # Imágenes client-agnósticas: se construyen una sola vez por commit.
  backend-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag (SHA corto)
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/tyakxa/tyakxa-tny-backend:${{ steps.meta.outputs.sha_short }}

      - name: Build + push worker (celery-worker y celery-beat comparten esta imagen)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ghcr.io/tyakxa/tyakxa-tny-worker:${{ steps.meta.outputs.sha_short }}

      - name: Build + push db-init
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/db-init.Dockerfile
          push: true
          tags: ghcr.io/tyakxa/tyakxa-tny-db-init:${{ steps.meta.outputs.sha_short }}

  # Imagen de frontend: una por cada cliente activo en deploy/clients.yaml.
  # Si mañana agregas 5 clientes más a ese archivo, este job simplemente
  # corre 5 veces más — no hay que tocar este workflow.
  frontend-por-cliente:
    needs: [leer-clientes]
    if: ${{ needs.leer-clientes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.leer-clientes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag (SHA corto)
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push frontend de ${{ matrix.name }}-${{ matrix.env }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api-${{ matrix.name }}-${{ matrix.env }}.tyakxa.com.mx
          tags: ghcr.io/tyakxa/tyakxa-tny-frontend:${{ steps.meta.outputs.sha_short }}-${{ matrix.name }}-${{ matrix.env }}
