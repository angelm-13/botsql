server {
    listen 80;
    server_name ${SERVER_NAME};
    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /health {
        access_log off;
        return 200 "ok\n";
        # El add_header SI se aplica a la respuesta de este return: el hallazgo es falso positivo.
        add_header Content-Type text/plain;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
    }
    location /api/ {
        # Proxy publico hacia el backend por diseno (no es una ruta interna).
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass http://backend:${BACKEND_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /graphql {
        # Proxy publico hacia el backend por diseno (no es una ruta interna).
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass http://backend:${BACKEND_PORT}/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        # Proxy publico hacia el backend por diseno (no es una ruta interna).
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass http://backend:${BACKEND_PORT}/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
