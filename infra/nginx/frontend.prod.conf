server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        expires 1y;
        # Se repiten a proposito: un add_header dentro de un location ANULA los del nivel superior,
        # y /assets/ necesita las mismas cabeceras de seguridad. Por eso no es una redefinicion accidental.
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "SAMEORIGIN" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;  # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition

        try_files $uri =404;
    }
}
